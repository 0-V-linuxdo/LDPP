<!doctype html>
<meta charset="utf-8">
<title>LD++ bridge</title>
<p id="s">loading…</p>
<script>
(async () => {
    const params = new URLSearchParams(location.search);
    const bundle = params.get("bundle") || "/userscript/LDPP.user.js";
    const [shim, code] = await Promise.all([
        fetch("/test/harness/gm-shim.js", { cache: "no-store" }).then(r => r.text()),
        fetch(bundle, { cache: "no-store" }).then(r => r.text()),
    ]);
    (window.opener || window.parent)?.postMessage({ type: "ldpp-bundle", shim, code }, "https://linux.do");
    document.getElementById("s").textContent = `sent ${code.length} bytes`;
    if (window.opener) setTimeout(() => window.close(), 300);
})();
</script>
